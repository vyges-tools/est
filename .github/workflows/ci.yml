# Build & test on every push to main and on pull requests (plus manual dispatch).
#
# Two jobs, because the crate has two faces:
#   - `lib`: the default features, no C++ — the pure rules (liberty clocks, the global-route
#     network) build and test on their own, and must keep doing so.
#   - `cli`: the `vyges-est` engine, which reads the design database through vyges-opendb, which
#     statically links libodb (C++, built from source). That needs the sibling layout below and a
#     C toolchain, as release.yml does.
#
# ⚠️ The sibling checkouts are not optional decoration: every `[patch]` path in Cargo.toml must
# resolve, and a patch whose path is missing is a hard `failed to load source` rather than a
# fall-back to the git source.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lib:
    name: library (no C++)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vyges-tools-est
    steps:
      - uses: actions/checkout@v4
        with:
          path: vyges-tools-est
      # The [patch] paths must resolve even when the features that use them are off.
      - uses: actions/checkout@v4
        with:
          repository: vyges-tools/opendb
          path: vyges-tools-opendb
      - uses: actions/checkout@v4
        with:
          repository: vyges-tools/opendb-lib
          path: vyges-tools-opendb-lib
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Test
        run: cargo test --verbose
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  cli:
    name: engine (build & test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vyges-tools-est
    steps:
      - uses: actions/checkout@v4
        with:
          path: vyges-tools-est
      - uses: actions/checkout@v4
        with:
          repository: vyges-tools/opendb
          path: vyges-tools-opendb
      - uses: actions/checkout@v4
        with:
          repository: vyges-tools/opendb-lib
          path: vyges-tools-opendb-lib

      - name: Toolchain
        # Boost (headers) + zlib only; fmt/spdlog/abseil are built from source by libodb's build.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ git bison libboost-dev libboost-iostreams-dev libbz2-dev zlib1g-dev

      - uses: dtolnay/rust-toolchain@stable

      # No --locked: the [patch] resolves the opendb crates to the freshly checked-out siblings @
      # main, which the committed lock file cannot know — let Cargo resolve.
      - name: Build
        run: cargo build --release --features cli --verbose
      - name: Test
        run: cargo test --release --features cli --verbose
      - name: Smoke the contract
        run: |
          ./target/release/vyges-est --version
          ./target/release/vyges-est --describe | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["name"]=="est" and len(d["openroad_pin"])==40, d'
          # A job with no estimate is VACUOUS and must exit 2, not 0.
          echo '{"steps":[]}' > /tmp/empty.json
          set +e; ./target/release/vyges-est estimate /tmp/empty.json; rc=$?; set -e
          test "$rc" = 2

  docs:
    name: book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.3/mdbook-v0.5.3-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$HOME/.local/bin"
          "$HOME/.local/bin/mdbook" build docs
