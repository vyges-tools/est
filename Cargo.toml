[package]
name = "vyges-est"
version = "0.1.37"
edition = "2021"
description = "Parasitic estimation for placed and globally routed nets: the RC networks a timer reads before detailed routing."
license = "Apache-2.0"
authors = ["Vyges <https://vyges.com/contact>"]
homepage = "https://vyges.com"
repository = "https://github.com/vyges-tools/est"

[features]
# The design database: the clock network and the placement path read it. OFF by default, so the
# rules stay testable without the C++ build.
odb = ["dep:vyges-opendb", "vyges-opendb/gen-write"]
# The command-line engine: the database, the Steiner-tree builder and JSON jobs.
cli = ["odb", "dep:vyges-stt", "dep:serde_json", "dep:flate2", "dep:vyges-events"]

[dependencies]
vyges-opendb = { git = "https://github.com/vyges-tools/opendb.git", branch = "main", optional = true }
vyges-stt = { git = "https://github.com/vyges-tools/stt.git", branch = "main", optional = true }
vyges-events = { git = "https://github.com/vyges-tools/events", branch = "main", default-features = false, optional = true }
serde_json = { version = "1", optional = true }
flate2 = { version = "1", optional = true }

[lib]
name = "vyges_est"
path = "src/lib.rs"

[[bin]]
name = "vyges-est"
path = "src/main.rs"
required-features = ["cli"]

# Local development against the sibling checkouts; a no-op for consumers pulling this by git.
[patch."https://github.com/vyges-tools/opendb.git"]
vyges-opendb = { path = "../vyges-tools-opendb" }

[patch."https://github.com/vyges-tools/opendb-lib.git"]
vyges-opendb-lib = { path = "../vyges-tools-opendb-lib" }
